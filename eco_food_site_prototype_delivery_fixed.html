rgin-top:16px">${t('publish')}</button></div><div class="panel"><h2>${t('myOffers')}</h2><div class="merchant-products">${merchantGoods.map(({merchant:m,product:p})=>`<div class="mini-product">${safeImg(p,m,productText(p,'name'))}<div><b>${productText(p,'name')}</b><span>${merchantName(m)} · ${money(p.price)}</span></div></div>`).join('')}</div></div></div></section>`;bindHeader();document.getElementById('publishBtn').onclick=()=>{const cat=document.getElementById('newCat').value;const name=document.getElementById('newName').value.trim()||'عرض جديد';const price=Number(document.getElementById('newPrice').value)||900;const oldPrice=Number(document.getElementById('newOld').value)||1600;const quantity=document.getElementById('newQty').value.trim()||'10 وحدات';const expiry=document.getElementById('newExpiry').value.trim()||'اليوم';const desc=document.getElementById('newDesc').value.trim()||'عرض جديد منشور من لوحة التاجر.';const items=document.getElementById('newItems').value.split(',').map(x=>x.trim()).filter(Boolean);const m=merchants[3];m.goods.unshift({id:'new'+Date.now(),cat,name,frName:name,price,oldPrice,quantity,frQuantity:quantity,expiry,frExpiry:expiry,desc,frDesc:desc,tags:[cat==='qoffa'?'قفة':'عرض جديد','من التاجر'],frTags:[cat==='qoffa'?'Panier':'Nouvelle offre','Commerçant'],items:items.length?items:['خبز','طماطم','ياغورت'],frItems:items.length?items:['Pain','Tomates','Yaourt'],image:getCategoryImage(cat)});state.screen='market';state.category=cat;render();};}

    function seedFactoryOffers(){
      const hasSeed=allProducts().some(x=>x.product.id==='v4');
      if(hasSeed)return;
      const veg=merchants.find(m=>m.id===2);
      const bakery=merchants.find(m=>m.id===1);
      const dairy=merchants.find(m=>m.id===5);
      const market=merchants.find(m=>m.id===4);
      veg.goods.push(
        {id:'v4',cat:'industrial',name:'طماطم طرية لإنتاج الكاتشب',frName:'Tomates tendres pour ketchup',price:5200,oldPrice:9200,quantity:'160 كغ',frQuantity:'160 kg',expiry:'تستعمل خلال 24 ساعة',frExpiry:'Sous 24h',desc:'طماطم ناضجة جداً مناسبة للمصانع الصغيرة لإنتاج الكاتشب، الصلصة أو معجون الطماطم. ليست موجهة للعرض في الرفوف بل للتحويل السريع.',frDesc:'Tomates très mûres adaptées à la transformation en ketchup, sauce ou concentré.',tags:['للمصانع','كاتشب','كمية كبيرة','تحويل سريع'],frTags:['Industrie','Ketchup','Grand volume','Transformation rapide'],image:images.tomato},
        {id:'v5',cat:'industrial',name:'تفاح ناضج للمربى والخل',frName:'Pommes mûres pour confiture et vinaigre',price:4300,oldPrice:7600,quantity:'120 كغ',frQuantity:'120 kg',expiry:'48 ساعة',frExpiry:'48h',desc:'تفاح ناضج مناسب لإنتاج المربى، العصير أو الخل الغذائي.',frDesc:'Pommes mûres adaptées à la confiture, au jus ou au vinaigre alimentaire.',tags:['مربى','عصائر','للمصانع'],frTags:['Confiture','Jus','Industrie'],image:images.apples}
      );
      bakery.goods.push({id:'b3',cat:'industrial',name:'خبز يوم سابق لإنتاج فتات الخبز',frName:'Pain de la veille pour chapelure',price:1800,oldPrice:3600,quantity:'70 كغ',frQuantity:'70 kg',expiry:'للتحويل خلال 24 ساعة',frExpiry:'Transformation sous 24h',desc:'كمية خبز مناسبة للمطاحن الصغيرة، المطاعم أو ورشات إنتاج فتات الخبز.',frDesc:'Lot de pain adapté à la production de chapelure.',tags:['فتات خبز','للمصانع','كمية كبيرة'],frTags:['Chapelure','Industrie','Grand volume'],image:images.bread2});
      dairy.goods.push({id:'d2',cat:'industrial',name:'حليب قريب الصلاحية للحلويات',frName:'Lait proche date pour pâtisserie',price:3900,oldPrice:6200,quantity:'90 لتر',frQuantity:'90 L',expiry:'يومان',frExpiry:'2 jours',desc:'حليب صالح للاستعمال السريع في الحلويات، الكريمة أو الإنتاج الغذائي اليومي.',frDesc:'Lait consommable à utiliser rapidement en pâtisserie ou production alimentaire.',tags:['حلويات','ألبان','للمصانع'],frTags:['Pâtisserie','Laitier','Industrie'],image:images.dairy});
      market.goods.push({id:'g4',cat:'industrial',name:'علب عصير قريبة الصلاحية للمقاهي',frName:'Jus proche date pour cafés',price:2600,oldPrice:4800,quantity:'60 علبة',frQuantity:'60 unités',expiry:'3 أيام',frExpiry:'3 jours',desc:'مشروبات صالحة للاستهلاك السريع مناسبة للمقاهي، المناسبات الصغيرة، أو إعادة البيع المحدودة.',frDesc:'Boissons consommables rapidement pour cafés et petits événements.',tags:['مشروبات','للمقاهي','سعر مخفض'],frTags:['Boissons','Cafés','Prix réduit'],image:images.juice});
    }
    seedFactoryOffers();

    function forceRealProductPhotos(){
      const photoById = {
        v1: images.tomato,
        v2: images.veg,
        v3: images.veg,
        v4: images.tomato,
        v5: images.veg,
        b1: images.bread,
        b2: images.bread2,
        b3: images.bread2,
        g1: images.dairy,
        g2: images.qoffa,
        g3: images.qoffa,
        g4: images.juice,
        d1: images.dairy,
        d2: images.dairy,
        r1: images.restaurant,
        r2: images.soup,
        h1: images.hotel,
        p1: images.pastry,
        j1: images.juice
      };

      merchants.forEach(m => {
        m.image = m.image || getCategoryImage(m.cat);
        (m.goods || []).forEach(g => {
          g.image = photoById[g.id] || g.image || getCategoryImage(g.cat || m.cat);
        });
      });
    }

    ensureProductImages();
    forceRealProductPhotos();
    render();
  </script>
